<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Søndervig · OSM-Geografietest v0.11</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#b8d9e4;font:14px system-ui}#view{width:100%;height:100%}#hud{position:absolute;top:12px;left:12px;right:12px;background:#173747e8;color:white;padding:12px;border-radius:12px;max-width:430px;pointer-events:none}#hud strong{font-size:17px}#hud p{margin:6px 0}#buttons{position:absolute;bottom:15px;right:12px;display:flex;gap:8px}button{font-size:20px;border:0;border-radius:12px;padding:13px;background:#fff;color:#173747}a{color:#d1f0ff}</style></head><body><div id="view"></div><div id="hud"><strong>🗺️ Søndervig · OSM-Test v0.11</strong><p id="status">Lade geografische Daten …</p><small>Harbo Stages Vej 3 · Testkarte, keine fertige Spielwelt. Wischen: drehen · Zwei Finger: Zoom · © OpenStreetMap-Mitwirkende (ODbL)</small></div><div id="buttons"><button id="plus">＋</button><button id="minus">－</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color('#a6d8e9');scene.fog=new THREE.Fog('#a6d8e9',180,720);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1400),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.querySelector('#view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x77836b,2.1));let light=new THREE.DirectionalLight(0xffebca,2);light.position.set(-120,160,60);scene.add(light);
const origin={lat:56.11246784,lon:8.12092021},toXYZ=(lat,lon)=>new THREE.Vector3((lon-origin.lon)*111320*Math.cos(origin.lat*Math.PI/180),0,-(lat-origin.lat)*111320);
function mesh(shape,color,y=0){let m=new THREE.Mesh(shape,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));m.position.y=y;scene.add(m);return m}
mesh(new THREE.PlaneGeometry(1100,1100),0x94a67d,-.1).rotation.x=-Math.PI/2;
function line(points,width,color){for(let i=1;i<points.length;i++){let a=points[i-1],b=points[i],d=b.clone().sub(a),len=d.length();if(len<.05)continue;let obj=mesh(new THREE.BoxGeometry(width,.09,len),color,.04);obj.position.x=(a.x+b.x)/2;obj.position.z=(a.z+b.z)/2;obj.rotation.y=Math.atan2(d.x,d.z)}}
function building(coords){let pts=coords.map(p=>toXYZ(p.lat,p.lon));if(pts.length<4)return;let shape=new THREE.Shape();shape.moveTo(pts[0].x,-pts[0].z);for(let p of pts.slice(1))shape.lineTo(p.x,-p.z);let geo=new THREE.ExtrudeGeometry(shape,{depth:3.8,bevelEnabled:false});geo.rotateX(-Math.PI/2);let obj=mesh(geo,0xa88e76);obj.position.y=0.06}
let marker=new THREE.Mesh(new THREE.ConeGeometry(2,7,10),new THREE.MeshLambertMaterial({color:0xf05445}));marker.position.set(0,5,0);scene.add(marker);
let angle=.6,tilt=.7,zoom=120,active=new Map(),lastPinch=0;
function draw(){let r=zoom;camera.position.set(Math.sin(angle)*r,Math.max(28,r*tilt),Math.cos(angle)*r);camera.lookAt(0,0,0);renderer.render(scene,camera);requestAnimationFrame(draw)}draw();
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY})});
renderer.domElement.addEventListener('pointermove',e=>{if(!active.has(e.pointerId))return;let old=active.get(e.pointerId);active.set(e.pointerId,{x:e.clientX,y:e.clientY});if(active.size===1){angle-=(e.clientX-old.x)*.006;tilt=Math.max(.18,Math.min(1.6,tilt+(e.clientY-old.y)*.005))}else if(active.size===2){let a=[...active.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoom=Math.max(25,Math.min(450,zoom*lastPinch/dist));lastPinch=dist}});
function up(e){active.delete(e.pointerId);lastPinch=0}renderer.domElement.addEventListener('pointerup',up);renderer.domElement.addEventListener('pointercancel',up);document.querySelector('#plus').onclick=()=>zoom=Math.max(25,zoom*.75);document.querySelector('#minus').onclick=()=>zoom=Math.min(450,zoom*1.33);
const south=56.1099,west=8.1158,north=56.115,east=8.126;
const q='[out:json][timeout:25];(way["highway"]('+south+','+west+','+north+','+east+');way["building"]('+south+','+west+','+north+','+east+'););out geom;';
async function load(){for(let host of ['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter']){try{let response=await fetch(host+'?data='+encodeURIComponent(q));if(!response.ok)throw Error('HTTP '+response.status);let json=await response.json(),roads=0,buildings=0;for(let e of json.elements){if(!e.geometry||e.geometry.length<2)continue;let p=e.geometry.map(v=>toXYZ(v.lat,v.lon));if(e.tags?.highway){let foot=/footway|path|pedestrian|steps|cycleway/.test(e.tags.highway);line(p,foot?1.7:5.8,foot?0xd5c7a9:0x535b5d);roads++}else if(e.tags?.building){building(e.geometry);buildings++}}status.textContent=roads+' OSM-Straßen/Wege · '+buildings+' Gebäude geladen. Dies ist eine echte Geodaten-Vorschau, noch ohne Geländehöhen.';return}catch(e){status.textContent='Datenserver nicht erreichbar, versuche Alternative …'}}status.textContent='OSM-Daten konnten nicht geladen werden. Bitte später neu öffnen.'}load();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
