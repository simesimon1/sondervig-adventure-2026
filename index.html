<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Søndervig Adventure 2026</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui;background:#8bd1ed;touch-action:none}canvas{display:block}#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#top span,#tip{background:#16394bcf;color:white;padding:10px;border-radius:12px;font-weight:700}#tip{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap}#controls{position:fixed;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,55px);gap:4px}button{border:0;border-radius:14px;background:#1a4a68d9;color:white;font-size:25px;touch-action:none}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#action{position:fixed;bottom:22px;right:20px;width:80px;height:80px;border-radius:50%;background:#ffc353;color:#173345;font-size:14px;font-weight:800}#start{position:fixed;inset:0;background:#173c55ee;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:white;padding:30px;z-index:2}#start p{max-width:350px}#play{background:#ffc353;color:#173345;font-size:20px;padding:14px 28px}</style></head><body><div id="top"><span>🏖️ Søndervig Adventure 2026</span><span id="score">🐚 0 / 8</span></div><div id="tip">Mission: Sammle 8 Muscheln am Strand!</div><div id="controls"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><button id="action">AKTION</button><div id="start"><h1>🌊 Søndervig Adventure 2026</h1><p>Erkunde Ferienhaus, Dünen und Nordsee. Sammle Muscheln und begrüße deine Familie. Steuerung: Touch-Pfeile oder WASD.</p><button id="play">Spielen ▶</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>(()=>{if(!window.THREE){document.querySelector('#start p').textContent='3D-Bibliothek nicht geladen. Bitte Internetverbindung prüfen.';return}const T=THREE,s=new T.Scene();s.background=new T.Color(0x9fdcf3);s.fog=new T.Fog(0x9fdcf3,70,150);const c=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,200),r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,1.6));document.body.prepend(r.domElement);s.add(new T.HemisphereLight(0xffffff,0x6d694e,2.5));const light=new T.DirectionalLight(0xffffff,1.6);light.position.set(15,35,20);s.add(light);const m=x=>new T.MeshLambertMaterial({color:x});function box(x,y,z,w,h,d,color){let a=new T.Mesh(new T.BoxGeometry(w,h,d),m(color));a.position.set(x,y,z);s.add(a);return a}function sphere(x,y,z,rad,color){let a=new T.Mesh(new T.SphereGeometry(rad,12,9),m(color));a.position.set(x,y,z);s.add(a);return a}box(0,-.3,0,110,.5,110,0xeed7a2);box(0,-.23,-35,110,.12,39,0x3b9bc5);box(0,-.19,30,110,.2,44,0x94aa6d);for(let i=0;i<35;i++){let a=sphere((Math.random()-.5)*100,-.2,-16+Math.random()*12,1.5+Math.random()*1.4,0xbcb486);a.scale.y=.35}box(0,2,25,13,4,10,0x906b4c);let roof=box(0,4.8,25,14,1.2,11,0x4e4640);roof.rotation.z=.12;box(0,1,19.9,2,2,.15,0x45656b);for(let x of [-4,4])box(x,2.4,19.9,2,1.6,.14,0xb4e3ec);box(0,.04,12,3,.08,15,0xc2a983);for(let i=0;i<12;i++){let x=-42+i*8;box(x,.7,39,.4,1.4,.4,0x795d41);sphere(x,1.9,39,2,0x468657)}function person(name,x,z,color,hair=0x694b38){let g=new T.Group();let body=new T.Mesh(new T.CylinderGeometry(.38,.47,1.2,10),m(color));body.position.y=1.1;g.add(body);let head=new T.Mesh(new T.SphereGeometry(.35,12,9),m(0xf0c5a2));head.position.y=1.95;g.add(head);let cap=new T.Mesh(new T.SphereGeometry(.36,12,9),m(hair));cap.position.y=2.2;cap.scale.y=.42;g.add(cap);g.position.set(x,0,z);s.add(g);return {name,g}}let player=person('Simon',0,8,0x376ca0);let people=[person('Swantje',-5,15,0xc27b88,0x9c7557),person('Ida',-7,12,0xe6a450,0xe5c65d),person('Tilda',-5,17,0xe3a8bd,0xe5c65d),person('Anke',9,20,0x9e80a8,0xe0c36d),person('Sören',12,20,0x577986),person('Amelie',15,20,0xc88983),person('Oma Loui',-12,18,0x9e74a0,0xe9c75e),person('Lena',-15,18,0x7894a5,0xe9c75e)];let shells=[];for(let i=0;i<22;i++){let sh=sphere(-42+Math.random()*84,.14,-11-Math.random()*16,.23,0xfaf1db);sh.scale.y=.5;shells.push(sh)}let count=0;const score=document.querySelector('#score'),tip=document.querySelector('#tip');function refresh(){score.textContent='🐚 '+count+' / 8';if(count>=8)tip.textContent='🎉 Mission geschafft! Begrüße deine Familie.'}let keys=new Set();onkeydown=e=>{keys.add(e.key.toLowerCase());if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys.delete(e.key.toLowerCase());for(let [id,key] of [['up','w'],['down','s'],['left','a'],['right','d']]){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys.add(key);el.setPointerCapture(e.pointerId)};el.onpointerup=el.onpointercancel=()=>keys.delete(key)}document.getElementById('action').onclick=()=>{let near=people.find(p=>p.g.position.distanceTo(player.g.position)<4);tip.textContent=near?'👋 Hallo '+near.name+'!':'🌞 Genieße den Urlaub!'};document.getElementById('play').onclick=()=>document.getElementById('start').remove();let last=performance.now();function frame(t){requestAnimationFrame(frame);let dt=Math.min((t-last)/1000,.05);last=t;let x=+(keys.has('d')||keys.has('arrowright'))-+(keys.has('a')||keys.has('arrowleft'));let z=+(keys.has('s')||keys.has('arrowdown'))-+(keys.has('w')||keys.has('arrowup'));let len=Math.hypot(x,z)||1;player.g.position.x=T.MathUtils.clamp(player.g.position.x+x/len*8*dt,-50,50);player.g.position.z=T.MathUtils.clamp(player.g.position.z+z/len*8*dt,-49,49);for(let sh of shells)if(sh.visible&&sh.position.distanceTo(player.g.position)<1.2){sh.visible=false;count++;refresh()}c.position.lerp(new T.Vector3(player.g.position.x,13,player.g.position.z+18),.09);c.lookAt(player.g.position.x,1,player.g.position.z-5);r.render(s,c)}requestAnimationFrame(frame);onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)}})()</script></body></html>
