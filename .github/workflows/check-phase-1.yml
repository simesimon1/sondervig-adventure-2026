name: Check phase 1 geometry
on:
  pull_request:
  push:
    branches: ['dev/**']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check browser module syntax
        run: |
          node --check src/game.js
          node --check src/scenery.js
          node --check src/world.js
