name: Check gameplay and character assets
on:
  pull_request:
  push:
    branches: ['dev/**']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check browser module syntax
        run: |
          node --check src/game.js
          node --check src/scenery.js
          node --check src/world.js
          node --check src/characters.js
          node --check src/studio.js
          node --check src/lighting.js
          node --check src/coast.js
          node --check src/beach.js
          node --check src/mission.js
