name: Import Søndervig OSM map
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-osm.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download OSM snapshot
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json,time,pathlib
          s,w,n,e=56.1099,8.1158,56.115,8.126
          q=f'[out:json][timeout:45];(way["highway"]({s},{w},{n},{e});way["building"]({s},{w},{n},{e}););out geom;'
          servers=['https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter']
          for server in servers:
              try:
                  req=urllib.request.Request(server+'?'+urllib.parse.urlencode({'data':q}),headers={'User-Agent':'SondervigAdventure2026/0.11 contact via GitHub repository'})
                  with urllib.request.urlopen(req,timeout=65) as resp: data=json.load(resp)
                  if not data.get('elements'): raise ValueError('No elements')
                  pathlib.Path('data').mkdir(exist_ok=True)
                  pathlib.Path('data/sondervig-osm.json').write_text(json.dumps(data,separators=(',',':')),encoding='utf-8')
                  print('Downloaded',len(data['elements']),'OSM elements')
                  break
              except Exception as ex:
                  print('Failed',server,repr(ex))
          else: raise RuntimeError('All OSM servers unavailable')
          PY
      - name: Commit map snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sondervig-osm.json
          if ! git diff --cached --quiet; then git commit -m "Store OSM snapshot for offline-style map loading"; git push; fi
